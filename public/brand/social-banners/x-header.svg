<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="xBgYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="xRedBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="40%" stop-color="#EF233C"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>

    <linearGradient id="xDonutDoughGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="xPinkFrostingGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="35%" stop-color="#F472B6"/>
      <stop offset="70%" stop-color="#EF9FBD"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="xMatchaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="50%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>

    <!-- Clay 3D Drop Shadows -->
    <filter id="xClayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1D3557" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D3557" flood-opacity="0.2"/>
    </filter>

    <filter id="xBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1D3557" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1D3557" flood-opacity="0.15"/>
    </filter>

    <pattern id="xDoughDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#FFF9DB" fill-opacity="0.45"/>
      <circle cx="30" cy="30" r="3" fill="#FFF9DB" fill-opacity="0.45"/>
      <circle cx="30" cy="10" r="1.8" fill="#EAB308" fill-opacity="0.25"/>
      <circle cx="10" cy="30" r="1.8" fill="#EAB308" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .x-heavy {
      font-family: 'Arial Rounded MT Bold', 'Fredoka', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }
    .x-fun {
      font-family: 'Fredoka', 'Comfortaa', 'Arial Rounded MT Bold', sans-serif;
      font-weight: 700;
    }
    .x-navy-stroke {
      stroke: #1D3557;
      stroke-width: 10px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1500" height="500" fill="url(#xBgYellowGrad)"/>
  <rect width="1500" height="500" fill="url(#xDoughDots)"/>

  <!-- Soft Butter Cream Tactile Wave (Background Layers) -->
  <path d="M-50,110 Q200,40 450,90 T950,50 T1350,130 Q1450,150 1550,100 L1550,-50 L-50,-50 Z" fill="#FFF9DB" fill-opacity="0.55"/>
  <path d="M-30,440 Q300,380 600,450 T1100,420 Q1300,470 1550,410 L1550,550 L-30,550 Z" fill="#FFF9DB" fill-opacity="0.45"/>

  <!-- Top Dripping Glaze Border (Red Strawberry & Cream Accents) -->
  <g fill="#EF233C" opacity="0.95" filter="url(#xBadgeShadow)">
    <path d="M0,0 L1500,0 L1500,24 
             C1440,24 1425,58 1390,58 C1355,58 1340,20 1295,20 
             C1250,20 1235,68 1195,68 C1155,68 1140,25 1090,25 
             C1040,25 1025,52 990,52 C955,52 940,18 890,18 
             C840,18 825,62 785,62 C745,62 730,28 680,28 
             C630,28 615,50 575,50 C535,50 520,22 470,22 
             C420,22 405,72 360,72 C320,72 305,30 255,30 
             C205,30 185,55 140,55 C95,55 75,20 0,20 Z"/>
  </g>
  <path d="M15,8 Q150,10 300,8 T700,8 T1100,8 T1480,8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating Background Candies & Dough Beads -->
  <circle cx="90" cy="180" r="14" fill="#38BDF8" stroke="#1D3557" stroke-width="3.5"/>
  <circle cx="160" cy="110" r="9" fill="#EF233C" stroke="#1D3557" stroke-width="2.5"/>
  <circle cx="280" cy="190" r="12" fill="#A3E635" stroke="#1D3557" stroke-width="3"/>
  <circle cx="940" cy="100" r="16" fill="#EF233C" stroke="#1D3557" stroke-width="3.5"/>
  <circle cx="1440" cy="90" r="12" fill="#38BDF8" stroke="#1D3557" stroke-width="3"/>

  <!-- Starbursts -->
  <g transform="translate(320, 95)" fill="#1D3557">
    <path d="M0,-12 Q1,-3 12,0 Q1,3 0,12 Q-1,3 -12,0 Q-1,-3 0,-12 Z"/>
  </g>
  <g transform="translate(910, 200)" fill="#EF233C">
    <path d="M0,-10 Q1,-2 10,0 Q1,2 0,10 Q-1,2 -10,0 Q-1,-2 0,-10 Z"/>
  </g>
  <g transform="translate(1450, 410)" fill="#FFF9DB">
    <path d="M0,-14 Q2,-3 14,0 Q2,3 0,14 Q-2,3 -14,0 Q-2,-3 0,-14 Z"/>
  </g>

  <!-- Left Side Ambient Dough Cloud (Behind Twitter Profile Photo Area) -->
  <g transform="translate(110, 360)">
    <!-- Decorative soft circle indicating profile photo buffer with stylish clay dough smile -->
    <path d="M-60,70 Q10,120 80,70" stroke="#1D3557" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.2"/>
    <text x="10" y="30" text-anchor="middle" class="x-heavy" font-size="12" fill="#1D3557" opacity="0.3" letter-spacing="1">DOH BOY ZONE</text>
  </g>


  <!-- ==================== CENTER-LEFT: BRAND CORE & SLOGAN ==================== -->

  <!-- Top Badges Row -->
  <g transform="translate(340, 50)">
    <!-- DOH-NUT Brand Badge Pill -->
    <g filter="url(#xBadgeShadow)">
      <rect x="0" y="0" width="220" height="58" rx="29" fill="url(#xRedBadgeGrad)" stroke="#1D3557" stroke-width="5"/>
      <rect x="5" y="5" width="210" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 6" opacity="0.6"/>
      <path d="M25,14 Q110,7 195,14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <text x="110" y="40" text-anchor="middle" class="x-heavy" font-size="30" fill="#FFF9DB" stroke="#1D3557" stroke-width="3" paint-order="stroke fill" letter-spacing="1.5">DOH-NUT™</text>
    </g>

    <!-- Malaysian-Born Pill Badge -->
    <g transform="translate(235, 6)" filter="url(#xBadgeShadow)">
      <rect x="0" y="0" width="315" height="46" rx="23" fill="#FFF9DB" stroke="#1D3557" stroke-width="4.5"/>
      <text x="157" y="30" text-anchor="middle" class="x-heavy" font-size="15" fill="#1D3557" letter-spacing="1">🇲🇾 MALAYSIAN ARTISAN DONUTS</text>
    </g>

    <!-- Panic Sticker -->
    <g transform="translate(565, 2) rotate(5)" filter="url(#xBadgeShadow)">
      <rect x="0" y="0" width="165" height="48" rx="14" fill="#FFF9DB" stroke="#1D3557" stroke-width="4"/>
      <text x="82" y="32" text-anchor="middle" class="x-heavy" font-size="17" fill="#EF233C" letter-spacing="1">DOH PANIC! 💥</text>
    </g>
  </g>

  <!-- THE MAIN SLOGAN: GOOD VIBE. GOOD DOH. (High Contrast & Impact) -->
  <g transform="translate(340, 160)">
    <!-- 3D Extrusion Depth Shadows -->
    <text x="7" y="65" class="x-heavy" font-size="76" fill="#1D3557" letter-spacing="2">GOOD VIBE.</text>
    <text x="7" y="145" class="x-heavy" font-size="76" fill="#1D3557" letter-spacing="2">GOOD DOH.</text>

    <!-- Navy Heavy Outline -->
    <text x="0" y="58" class="x-heavy x-navy-stroke" font-size="76" fill="#1D3557" letter-spacing="2">GOOD VIBE.</text>
    <text x="0" y="138" class="x-heavy x-navy-stroke" font-size="76" fill="#1D3557" letter-spacing="2">GOOD DOH.</text>

    <!-- Foreground Infill -->
    <text x="0" y="58" class="x-heavy" font-size="76" fill="#FFF9DB" letter-spacing="2">GOOD VIBE.</text>
    <text x="0" y="138" class="x-heavy" font-size="76" fill="url(#xBgYellowGrad)" stroke="#1D3557" stroke-width="3" paint-order="stroke fill" letter-spacing="2">GOOD DOH.</text>

    <!-- Red Swirl Brush Accent -->
    <path d="M4,168 C140,184 300,165 420,172" stroke="#EF233C" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M4,168 C140,184 300,165 420,172" stroke="#1D3557" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bottom Info Pills Bar -->
  <g transform="translate(340, 395)">
    <!-- Feature Pill 1: Fresh Glaze -->
    <g filter="url(#xBadgeShadow)">
      <rect x="0" y="0" width="225" height="42" rx="21" fill="#1D3557"/>
      <text x="112" y="27" text-anchor="middle" class="x-heavy" font-size="14" fill="#FFF9DB" letter-spacing="1">⚡ FRESHLY GLAZED IN KL</text>
    </g>

    <!-- Feature Pill 2: Delivery -->
    <g transform="translate(235, 0)" filter="url(#xBadgeShadow)">
      <rect x="0" y="0" width="230" height="42" rx="21" fill="#FFF9DB" stroke="#1D3557" stroke-width="4"/>
      <text x="115" y="27" text-anchor="middle" class="x-heavy" font-size="14" fill="#1D3557" letter-spacing="1">📦 KL &amp; SELANGOR DELIVERY</text>
    </g>

    <!-- Website & Handle Tag -->
    <g transform="translate(475, 0)" filter="url(#xBadgeShadow)">
      <rect x="0" y="0" width="250" height="42" rx="21" fill="url(#xRedBadgeGrad)" stroke="#1D3557" stroke-width="4"/>
      <text x="125" y="27" text-anchor="middle" class="x-heavy" font-size="16" fill="#FFF9DB" letter-spacing="1.5">dohnut.my • @thisisdohnut</text>
    </g>
  </g>


  <!-- ==================== RIGHT SIDE: HERO CLAYMATION DOH BOY & DONUT ==================== -->

  <!-- Secondary Floating Mini Donut: Matcha White Drizzle -->
  <g transform="translate(1020, 110) rotate(-16)" filter="url(#xClayShadow)">
    <ellipse cx="0" cy="0" rx="58" ry="50" fill="url(#xDonutDoughGrad)" stroke="#1D3557" stroke-width="6"/>
    <path d="M-48,-15 C-45,-40 45,-40 48,-15 C52,8 40,22 30,14 C20,6 15,30 2,26 C-10,22 -15,36 -28,30 C-40,24 -50,6 -48,-15 Z" fill="url(#xMatchaGrad)" stroke="#1D3557" stroke-width="4"/>
    <ellipse cx="0" cy="4" rx="18" ry="15" fill="#FDE047" stroke="#1D3557" stroke-width="5"/>
    <path d="M-30,-12 Q-10,-26 10,-12 T40,-6" stroke="#FFF9DB" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Hero Main Donut with Strawberry Glaze + DOH BOY Mascot -->
  <g transform="translate(1260, 275)" filter="url(#xClayShadow)">
    <!-- Main Donut Dough Crust -->
    <ellipse cx="0" cy="0" rx="190" ry="165" fill="url(#xDonutDoughGrad)" stroke="#1D3557" stroke-width="11"/>
    <ellipse cx="0" cy="14" rx="175" ry="145" fill="#B45309" opacity="0.25"/>

    <!-- Thick Viscous Pink Glaze -->
    <path d="M-175,-40 
             C-170,-140 170,-140 175,-40 
             C185,30 165,85 125,70 
             C105,62 100,135 60,130 
             C35,125 20,85 0,95 
             C-20,102 -30,150 -65,142 
             C-100,134 -105,80 -130,78 
             C-160,75 -180,15 -175,-40 Z" 
          fill="url(#xPinkFrostingGrad)" stroke="#1D3557" stroke-width="9"/>

    <!-- Specular Highlight Curve -->
    <path d="M-135,-75 C-85,-120 85,-120 135,-75" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.65"/>
    <!-- Glaze Drops -->
    <circle cx="58" cy="116" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="-62" cy="128" r="6" fill="#FFFFFF" opacity="0.8"/>

    <!-- Central Donut Hole -->
    <ellipse cx="0" cy="12" rx="60" ry="52" fill="#FDE047" stroke="#1D3557" stroke-width="11"/>
    <ellipse cx="0" cy="18" rx="50" ry="42" fill="#D97706" opacity="0.3"/>

    <!-- Rainbow Clay Sprinkles -->
    <rect x="-100" y="-55" width="28" height="11" rx="5.5" fill="#FDE047" stroke="#1D3557" stroke-width="3" transform="rotate(35 -100 -55)"/>
    <rect x="-50" y="-95" width="28" height="11" rx="5.5" fill="#38BDF8" stroke="#1D3557" stroke-width="3" transform="rotate(-20 -50 -95)"/>
    <rect x="30" y="-100" width="26" height="11" rx="5.5" fill="#FFFFFF" stroke="#1D3557" stroke-width="3" transform="rotate(45 30 -100)"/>
    <rect x="90" y="-60" width="28" height="11" rx="5.5" fill="#A3E635" stroke="#1D3557" stroke-width="3" transform="rotate(-35 90 -60)"/>
    <rect x="110" y="-10" width="26" height="11" rx="5.5" fill="#EF233C" stroke="#1D3557" stroke-width="3" transform="rotate(15 110 -10)"/>
    <rect x="-85" y="60" width="26" height="11" rx="5.5" fill="#FDE047" stroke="#1D3557" stroke-width="3" transform="rotate(25 -85 60)"/>
    <rect x="85" y="55" width="26" height="11" rx="5.5" fill="#38BDF8" stroke="#1D3557" stroke-width="3" transform="rotate(-25 85 55)"/>

    <!-- DOH BOY Character Eyes & Mouth -->
    <g transform="translate(0, -32)">
      <!-- Left Eye -->
      <ellipse cx="-34" cy="-14" rx="19" ry="24" fill="#FFFFFF" stroke="#1D3557" stroke-width="6"/>
      <ellipse cx="-30" cy="-12" rx="10" ry="14" fill="#1D3557"/>
      <circle cx="-33" cy="-17" r="5" fill="#FFFFFF"/>
      <circle cx="-27" cy="-8" r="2.5" fill="#FFFFFF"/>

      <!-- Right Eye -->
      <ellipse cx="34" cy="-14" rx="19" ry="24" fill="#FFFFFF" stroke="#1D3557" stroke-width="6"/>
      <ellipse cx="30" cy="-12" rx="10" ry="14" fill="#1D3557"/>
      <circle cx="27" cy="-17" r="5" fill="#FFFFFF"/>
      <circle cx="33" cy="-8" r="2.5" fill="#FFFFFF"/>

      <!-- Cheeks -->
      <ellipse cx="-60" cy="8" rx="12" ry="7" fill="#EF233C" opacity="0.65"/>
      <ellipse cx="60" cy="8" rx="12" ry="7" fill="#EF233C" opacity="0.65"/>

      <!-- Big Happy Smile -->
      <path d="M-28,10 Q0,38 28,10 Z" fill="#1D3557"/>
      <path d="M-14,21 Q0,32 14,21 Q9,29 -9,29 Z" fill="#EF233C"/>
      <path d="M-30,8 Q0,42 30,8" fill="none" stroke="#1D3557" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Mini Baker Hat on Dough -->
    <g transform="translate(0, -150)" filter="url(#xBadgeShadow)">
      <path d="M-32,18 L32,18 L25,4 L-25,4 Z" fill="#FFF9DB" stroke="#1D3557" stroke-width="5"/>
      <path d="M-28,4 C-45,-6 -38,-38 -18,-32 C-10,-48 10,-48 18,-32 C38,-38 45,-6 28,4 Z" fill="#FFF9DB" stroke="#1D3557" stroke-width="5"/>
      <circle cx="0" cy="-14" r="10" fill="#EF233C" stroke="#1D3557" stroke-width="3"/>
      <text x="0" y="-10" text-anchor="middle" font-family="'Arial Rounded MT Bold', sans-serif" font-size="9" font-weight="900" fill="#FFF9DB">D</text>
    </g>

    <!-- Waving Glove (Right) -->
    <g transform="translate(165, -60) rotate(20)" filter="url(#xBadgeShadow)">
      <path d="M-20,28 Q0,8 20,0" stroke="#1D3557" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M-20,28 Q0,8 20,0" stroke="#FDE047" stroke-width="8" stroke-linecap="round" fill="none"/>
      <ellipse cx="32" cy="-6" rx="20" ry="17" fill="#FFF9DB" stroke="#1D3557" stroke-width="5"/>
      <ellipse cx="22" cy="-22" rx="9" ry="13" fill="#FFF9DB" stroke="#1D3557" stroke-width="4.5" transform="rotate(-20 22 -22)"/>
      <ellipse cx="39" cy="-24" rx="7" ry="12" fill="#FFF9DB" stroke="#1D3557" stroke-width="4.5"/>
      <ellipse cx="51" cy="-15" rx="7" ry="11" fill="#FFF9DB" stroke="#1D3557" stroke-width="4.5" transform="rotate(15 51 -15)"/>
      <rect x="12" y="3" width="32" height="12" rx="6" fill="#FFF9DB" stroke="#1D3557" stroke-width="4.5"/>
    </g>
  </g>

  <!-- Circular Badge Sticker (Far Right) -->
  <g transform="translate(1420, 190) rotate(14)" filter="url(#xBadgeShadow)">
    <circle cx="0" cy="0" r="48" fill="#EF233C" stroke="#1D3557" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFF9DB" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="0" y="-14" text-anchor="middle" class="x-heavy" font-size="10" fill="#FFF9DB" letter-spacing="1">TACTILE</text>
    <text x="0" y="5" text-anchor="middle" class="x-heavy" font-size="18" fill="#FDE047" letter-spacing="1">DOH</text>
    <text x="0" y="20" text-anchor="middle" class="x-heavy" font-size="9" fill="#FFF9DB" letter-spacing="1">100% FRESH</text>
  </g>

</svg>
