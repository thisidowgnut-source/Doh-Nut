<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOHNUT — Sira Sambal (Regenerated Concept Visual)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#FFF8E7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;color:#0B1D36}
.container{width:min(420px,92vw);background:linear-gradient(135deg,#FF1493 0%,#D7263D 60%,#FFE066 100%);border-radius:28px;padding:1.5rem 1.25rem 2rem;box-shadow:0 28px 60px rgba(11,29,54,0.2);position:relative;overflow:hidden}
.badge{position:absolute;top:14px;right:14px;background:#FFE066;color:#D7263D;font-family:'Fredoka One',cursive;font-size:.55rem;padding:.25rem .55rem;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 12px rgba(215,38,61,0.35)}
.header{text-align:center;margin-bottom:1rem}
h1{font-family:'Fredoka One',cursive;font-size:1.9rem;color:#0B1D36;letter-spacing:.02em;line-height:1.15;text-shadow:0 4px 0 #FFE066;}
h2{font-family:'Fredoka One',cursive;font-size:.9rem;color:#FF1493;margin-top:.2rem;opacity:.9}
.hero{width:100%;aspect-ratio:4/3;background:radial-gradient(circle at 50% 50%,#FFE066 0%,#FF1493 60%,#D7263D 120%);border-radius:22px;position:relative;overflow:hidden;box-shadow:inset 0 0 40px rgba(11,29,54,0.2);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center}
.hero-inner{position:relative;width:260px;height:170px}
/* Deep red glossy sambal coating */
.sambal-coat{position:absolute;top:22px;left:30px;width:200px;height:115px;border-radius:50%;background:linear-gradient(180deg,#FF1493 10%,#D7263D 60%,#8B1538 100%);box-shadow:inset 0 -8px 24px rgba(215,38,61,0.7),0 6px 20px rgba(11,29,54,0.25);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,0.3)}
/* Lacquered glossy sheen */
.sheen{position:absolute;inset:14px;border-radius:50%;background:linear-gradient(120deg,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0.05) 50%,rgba(255,255,255,0.25) 100%);box-shadow:0 2px 10px rgba(255,255,255,0.3)}
/* Soft fluffy dough bottom */
.dough{position:absolute;top:112px;left:26px;width:208px;height:42px;background:linear-gradient(180deg,#FFE066 30%,#FFB347 100%);border-radius:20px 20px 100px 100px;box-shadow:0 4px 14px rgba(11,29,54,0.15)}
/* Toasted sesame dots */
.sesame{position:absolute;top:36px;left:52px;width:5px;height:5px;background:#FFE066;border-radius:50%;box-shadow:16px 4px #FFE066,34px -2px #FFE066,52px 6px #FFE066,70px -4px #FFE066,88px 2px #FFE066,106px 8px #FFE066,126px -2px #FFE066,144px 4px #FFE066}
/* Brand tag */
.brand-tag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;color:#FFE066;font-size:.65rem;text-shadow:0 2px 0 #D7263D;letter-spacing:.12em;opacity:.95}
.glass{position:absolute;inset:0;border-radius:22px;background:linear-gradient(120deg,rgba(255,255,255,0.1) 0%,rgba(255,255,255,0.03) 60%,rgba(255,255,255,0.15) 100%);pointer-events:none}
.info{margin-top:.8rem;text-align:center}
.info .price{font-family:'Fredoka One',cursive;font-size:2.4rem;color:#D7263D;text-shadow:0 3px 0 #FFE066;line-height:1}
.info .price span{font-size:1rem;vertical-align:super;margin-left:.1rem;opacity:.7}
.info .desc{font-size:.82rem;color:#D7263D;opacity:.85;margin-top:.25rem;line-height:1.45;max-width:260px;margin-left:auto;margin-right:auto;text-shadow:0 1px 2px rgba(255,255,255,0.5)}
.tags{margin-top:.6rem;display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.tag{background:#D7263D;color:#FFE066;font-size:.6rem;padding:.2rem .45rem;border-radius:999px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 6px rgba(215,38,61,0.3)}
.footer{margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.7rem;color:#D7263D;opacity:.6;font-family:'Fredoka One',cursive}
</style>
</head>
<body>
<div class="container" aria-label="DOHNUT Sira Sambal — branded product concept visual">
  <div class="badge" aria-label="New product">NEW</div>
  <div class="header">
    <h1>Sira Sambal</h1>
    <h2>Sira Series / Malaysian Signature</h2>
  </div>
  <div class="hero" aria-label="Ring donut with deep red sticky glossy sambal sira coating, toasted sesame, soft fluffy dough">
    <div class="hero-inner" role="img" aria-label="Deep red sticky glossy sambal coating with toasted sesame dots on fluffy yellow dough">
      <div class="sambal-coat"></div>
      <div class="sheen"></div>
      <div class="dough"></div>
      <div class="sesame" aria-label="Toasted sesame seed dots"></div>
      <div class="brand-tag">DOH-NUT MASTER 2026</div>
      <div class="glass"></div>
    </div>
  </div>
  <div class="info">
    <div class="price">RM 5.80 <span>/pc</span></div>
    <div class="desc" aria-label="Product description">Deep red sambal sira · sticky · glossy · lacquered · toasted sesame · soft fluffy DOH-NUT dough.</div>
  </div>
  <div class="tags" aria-label="Tags">
    <span class="tag">SIRA</span>
    <span class="tag">SAMBAL</span>
    <span class="tag">SPICY</span>
    <span class="tag">MALAYSIAN</span>
  </div>
  <div class="footer">
    <span aria-label="Live indicator"></span>
    DOHNUT BRAND CONCEPT VISUAL — REGENERATED (NOT EXTERNAL TUTORIAL)
  </div>
</div>
</body>
</html>
